name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    # A fresh database to check that every migration and the demo seed apply.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: opsflow
          POSTGRES_PASSWORD: opsflow
          POSTGRES_DB: opsflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsflow -d opsflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://opsflow:opsflow@localhost:5432/opsflow?schema=public
      JWT_ACCESS_SECRET: ci-only-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy
      - name: Seed demo data
        run: npm run db:seed

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
